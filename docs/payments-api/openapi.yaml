      operationId: rates.get
      summary: Get the price of points in a currency
      x-requirements: [FR-RATE-02]
      x-priority: P0
      parameters:
        - name: from
          in: query
          required: true
          description: Source currency or asset.
          schema: { type: string, examples: [zar] }
        - name: to
          in: query
          required: true
          description: Destination currency or asset.
          schema: { type: string, examples: [ndeipi-points] }
      responses:
        '200':
          description: The current rate.
          headers:
