          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /quotes:
    post:
      tags: [Rates and routes]
      operationId: quotes.create
      summary: Lock a price for a conversion
      description: |
        Locks the price for converting an amount between Ndeipi Points and NdeipiCoin, for a
        short time (`expires_at`, 30 seconds by default). Pass its `id` as `quote_id` on the
        conversion transfer. The price includes Ndeipi's spread, shown separately in `fees`.

        NdeipiCoin is bought for Ndeipi's stock through a manual OTC desk, so the price comes from
        what Ndeipi last paid and is refreshed by its treasury team. A quote larger than Ndeipi's
        stock, or than the treasury can back with new points, returns
        `422 insufficient_liquidity`.
      x-requirements: [FR-RATE-04, FR-XFER-10]
      x-priority: P0
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteCreateRequest' }
      responses:
        '201':
          description: Quote locked.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: |
            NdeipiCoin has no current price: no OTC trade has been recorded, or the last one is
            older than Ndeipi allows quoting from. Code `provider_unavailable`. Retry later.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /quotes/{quote_id}:
    parameters:
      - name: quote_id
        in: path
        required: true
        schema: { type: string, pattern: '^qt_[0-9A-Z]{26}$' }
    get:
      tags: [Rates and routes]
      operationId: quotes.get
      summary: Get a quote
      x-requirements: [FR-RATE-04]
