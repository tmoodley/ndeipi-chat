  # ---------------------------------------------------------------- Rates and routes
  /routes:
    get:
      tags: [Rates and routes]
      operationId: routes.list
      summary: List supported routes
      description: |
        Every source the server accepts, with the destinations it reaches, amount limits,
        precision and settlement estimates. Rails appear only as data here; SDKs MUST NOT
        hard-code them (FR-RATE-01, DC-08). Not paginated.
      x-requirements: [FR-RATE-01]
      x-priority: P0
      parameters:
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/TransferKind' }
        - name: country
          in: query
          description: ISO 3166-1 alpha-2 country code.
          schema: { $ref: '#/components/schemas/Country' }
      responses:
        '200':
          description: All routes matching the filters.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Route' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }

