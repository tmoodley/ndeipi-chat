openapi: 3.1.0
info:
  title: Ndeipi Enterprise Server Payments API
  version: 0.1.0-draft
  summary: User accounts, user-to-user transfers, and on-ramp and off-ramp.
  description: |
    Draft contract for the payments API specified in "SRS: Ndeipi Enterprise Server Payments API
    and SDK" (2026-10-06). This file is the single source of truth (DC-01, SC-01): the server
    validates requests and responses against it and every SDK is generated from it.

    Resource and field names are proposals until the M0 contract review and counsel's advice on
    LEG-04. Bridge's public API is a design reference only; no Bridge text is reproduced (LEG-03).

    ## Conventions

    - **Authentication.** Every request carries the integrator's key in the `Api-Key` header.
      Sandbox keys start `nd_test_` and production keys start `nd_live_` (FR-CORE-03).
    - **Idempotency.** Every `POST` requires an `Idempotency-Key` header. The server replays the
      original status and body for the same key for 24 hours and sets `Idempotent-Replayed: true`.
      Reusing a key with a different body returns `409 idempotency_key_reused` (FR-CORE-04/05).
      `PATCH` and `DELETE` are idempotent by definition and take no key.
    - **Amounts** are decimal strings, never JSON numbers (FR-API-02). An amount may carry at most
      the number of decimal places of its asset or currency, which `GET /v1/routes` publishes.
      Extra places are rejected with `422 invalid_amount_precision`; the server never rounds an
      amount a caller supplied. Fees and converted amounts are rounded half-even to the
      destination's precision, and receipts show the rounded values.
    - **Pagination.** Lists return newest first, take `limit` (1 to 100, default 10) and one of
      `starting_after` or `ending_before`, and return `{ data, has_more }` (FR-API-04).
    - **Versions.** Every mutable object carries an integer `version` that increases by one on
      each change. Webhook events carry the version of the snapshot they hold, so a receiver can
      drop a delivery older than what it already has. Events are not delivered in order.
    - **Errors.** Every error has a stable `code`, a `message`, the offending `field` where there
      is one, and the `request_id` (FR-API-06). Messages never contain the API key (FR-API-07).
      Clients MUST accept codes they do not recognise (FR-API-03).
    - **Request IDs.** Every response carries `Request-Id`, which matches the server audit record
      (NFR-OBS-01).
    - **Rate limits.** A key over its limit receives `429` with `Retry-After` in seconds
      (SRV-OPS-06). Every response carries `RateLimit-Limit`, `RateLimit-Remaining` and
      `RateLimit-Reset`. The limits themselves are set per integrator and are not part of the
      contract.

    `x-requirements` on each operation lists the SRS IDs it implements, and `x-priority` its
    release priority.
  contact:
    name: Ndeipi
servers:
  - url: https://{host}/v1
    description: Production. Ndeipi assigns the host.
    variables:
      host:
        default: api.ndeipi.example
  - url: https://{host}/v1
    description: Sandbox. Same contract, no real funds (FR-SBX-01).
    variables:
      host:
        default: sandbox.api.ndeipi.example
security:
  - ApiKey: []
tags:
  - name: Users
  - name: Wallets
  - name: Transfers
  - name: Deposit accounts
  - name: Payout accounts
  - name: Rates and routes
  - name: Webhooks
  - name: Sandbox
    description: Available only with a sandbox key. Production keys receive `403 sandbox_only`.

paths:
  # ---------------------------------------------------------------- Users
  /users:
    post:
      tags: [Users]
      operationId: users.create
      summary: Create a user
      description: |
        Creates an individual or business user. Identity data is collected through the hosted
        onboarding link, not through this call. `external_reference` is unique per integrator; a
        second create with the same reference returns `409 external_reference_exists` naming the
        existing user.
      x-requirements: [FR-USER-01, FR-USER-02]
      x-priority: P0
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [Users]
      operationId: users.list
      summary: List users
      x-requirements: [FR-USER-07, FR-API-04]
      x-priority: P0
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/EndingBefore'
        - name: external_reference
          in: query
          schema: { type: string }
        - name: kyc_status
          in: query
          schema: { $ref: '#/components/schemas/KycStatus' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/UserStatus' }
      responses:
        '200':
          description: A page of users.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      operationId: users.get
      summary: Get a user
      x-requirements: [FR-USER-07]
      x-priority: P0
      responses:
        '200':
          description: The user.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Users]
      operationId: users.update
      summary: Update a user
      description: Updates contact details and metadata. Identity data changes go through a new onboarding link.
      x-requirements: [FR-USER-07]
      x-priority: P0
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200':
          description: The updated user.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /users/{user_id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      operationId: users.deactivate
      summary: Deactivate a user
      description: |
        A deactivated user cannot send or receive funds and cannot be reactivated through the API.
        Deactivation is refused with `409 user_has_balance` while any of the user's wallets holds
        an available or pending balance, and with `409 user_has_open_transfers` while a transfer
        involving the user is not in a final state. The integrator pays the balance out first.
      x-requirements: [FR-USER-07]
      x-priority: P0
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The deactivated user.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /users/{user_id}/onboarding_links:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      operationId: users.createOnboardingLinks
      summary: Create onboarding links
      description: |
        Issues a hosted KYC link and a terms-of-service link in one call. Calling again issues
        fresh links and expires the previous ones.
      x-requirements: [FR-USER-03, SRV-KYC-01]
      x-priority: P0
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingLinksCreateRequest' }
      responses:
        '201':
          description: Links issued.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingLinks' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  # ---------------------------------------------------------------- Wallets
  /users/{user_id}/wallets:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Wallets]
      operationId: wallets.create
      summary: Create a wallet
      description: |
        Creates a wallet for an approved user. A user holds at most one wallet per asset in 1.0;
        a second create for the same asset returns `409 wallet_exists`. That wallet is the
        user's default for the asset, which `transfers.send` resolves.
      x-requirements: [FR-WAL-01, FR-USER-05]
      x-priority: P0
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalletCreateRequest' }
      responses:
        '201':
          description: Wallet created.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [Wallets]
      operationId: wallets.list
      summary: List a user's wallets
      x-requirements: [FR-WAL-04]
      x-priority: P0
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/EndingBefore'
        - name: asset
          in: query
          schema: { $ref: '#/components/schemas/Asset' }
      responses:
        '200':
          description: A page of wallets.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Wallet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /users/{user_id}/wallets/{wallet_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/WalletId'
    get:
      tags: [Wallets]
      operationId: wallets.get
      summary: Get a wallet
      x-requirements: [FR-WAL-04]
      x-priority: P0
      responses:
        '200':
          description: The wallet, with its current balance.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /users/{user_id}/wallets/{wallet_id}/balance:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/WalletId'
    get:
      tags: [Wallets]
      operationId: wallets.balance
      summary: Get a wallet's balance
      x-requirements: [FR-WAL-02, SRV-LED-05]
      x-priority: P0
      responses:
        '200':
          description: Available and pending balances.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletBalance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /users/{user_id}/wallets/{wallet_id}/history:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/WalletId'
    get:
      tags: [Wallets]
      operationId: wallets.history
      summary: List a wallet's history
      description: |
        One entry per ledger posting line that touched the wallet. Summing `amount` (credits
        positive, debits negative) over all entries for a bucket gives that bucket's balance
        (NFR-REL-03).
      x-requirements: [FR-WAL-03]
      x-priority: P0
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/EndingBefore'
        - $ref: '#/components/parameters/CreatedAfter'
        - $ref: '#/components/parameters/CreatedBefore'
      responses:
        '200':
          description: A page of history entries.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/WalletHistoryEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  # ---------------------------------------------------------------- Transfers
  /transfers:
    post:
      tags: [Transfers]
      operationId: transfers.create
      summary: Create a transfer
      description: |
        One resource for every money movement (DC-04). The kind follows from the source and
        destination:

        | Source | Destination | Kind |
        |---|---|---|
        | `wallet` | another user's `wallet` in the same asset | `user_to_user` |
        | `wallet` | the same user's `wallet` in another asset | `conversion` |
        | `fiat` | `wallet` | `onramp` |
        | `wallet` | `payout_account` | `offramp` |

        Any other combination returns `422 unsupported_route`. A `user_to_user` transfer posts to
        the ledger in one transaction and returns `completed` (or `in_review`) in the response
        without calling the provider (SRV-LED-04). An `onramp` returns `awaiting_funds` with
        deposit instructions. An `offramp` debits the source wallet when accepted and returns
        `pending`.

        Points keep their kind when sent: a `user_to_user` transfer of points spends the sender's
        earned points first and credits the recipient with the same split, so a reward never
        becomes cashable by changing hands. The receipt shows both parts.

        A `conversion` buys or sells NdeipiCoin with Ndeipi Points. It needs a `quote_id` from
        `POST /quotes` that matches its wallets and amount and has not expired. It settles from
        Ndeipi's own stock in one ledger transaction and returns `completed`, so it never waits on
        the OTC desk. Only cashable (purchased) points can buy NdeipiCoin; earned points return
        `422 amount_exceeds_cashable`. Points from selling NdeipiCoin are cashable. Off-ramps and
        on-ramps carry points only: NdeipiCoin is cashed out by converting it to points first.

        With `dry_run: true` the request is validated exactly as a real one, including KYC,
        balance, route and limit checks, and returns `200` with a `TransferPreview`. Nothing is
        created and no funds move. A failing dry run returns the same error a real create would.
      x-requirements: [FR-XFER-01, FR-XFER-02, FR-XFER-03, FR-XFER-06, FR-ON-02, FR-OFF-03, FR-RATE-03, FR-USER-05]
      x-priority: P0
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferCreateRequest' }
            examples:
              userToUser:
                summary: User to user
                value:
                  source: { type: wallet, wallet_id: wal_01JA8Z4K2V9QW3H6Y7XKD2M0RS }
                  destination: { type: wallet, wallet_id: wal_01JA8Z5B7C1DE2F3G4H5J6K7LM }
                  amount: '25.00'
                  integrator_reference: invoice-7781
              onramp:
                summary: One-off on-ramp
                value:
                  source: { type: fiat, currency: zar, rail: absa_eft }
                  destination: { type: wallet, wallet_id: wal_01JA8Z4K2V9QW3H6Y7XKD2M0RS }
                  amount: '100.00'
              offramp:
                summary: Off-ramp
                value:
                  source: { type: wallet, wallet_id: wal_01JA8Z5B7C1DE2F3G4H5J6K7LM }
                  destination: { type: payout_account, payout_account_id: pa_01JA8Z6N3P4Q5R6S7T8U9V0WXY }
                  amount: '20.00'
      responses:
        '200':
          description: Dry run passed. Nothing was created.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferPreview' }
        '201':
          description: Transfer created.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
        '5XX': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [Transfers]
      operationId: transfers.list
      summary: List transfers
      x-requirements: [FR-XFER-07]
      x-priority: P0
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/EndingBefore'
        - $ref: '#/components/parameters/CreatedAfter'
        - $ref: '#/components/parameters/CreatedBefore'
        - name: user_id
          in: query
          description: Transfers where this user owns the source or the destination.
          schema: { $ref: '#/components/schemas/UserIdValue' }
        - name: wallet_id
          in: query
          description: Transfers where this wallet is the source or the destination.
          schema: { $ref: '#/components/schemas/WalletIdValue' }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/TransferState' }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/TransferKind' }
        - name: integrator_reference
          in: query
          schema: { type: string }
      responses:
        '200':
          description: A page of transfers.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Transfer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /transfers/{transfer_id}:
    parameters:
      - $ref: '#/components/parameters/TransferId'
    get:
      tags: [Transfers]
      operationId: transfers.get
      summary: Get a transfer
      x-requirements: [FR-XFER-07]
      x-priority: P0
      responses:
        '200':
          description: The transfer.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /transfers/{transfer_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/TransferId'
    post:
      tags: [Transfers]
      operationId: transfers.cancel
      summary: Cancel a transfer
      description: |
        Allowed only before the transfer's ledger posting: an `onramp` in `awaiting_funds`, or any
        transfer in `pending` that has not yet posted. Otherwise returns
        `409 transfer_not_cancelable`. Funds that arrive for a canceled on-ramp are returned to
        the sender and reported with a `deposit.returned` event.
      x-requirements: [FR-XFER-08, FR-ON-03]
      x-priority: P1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The canceled transfer.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  # ---------------------------------------------------------------- Deposit accounts
  /users/{user_id}/deposit_accounts:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Deposit accounts]
      operationId: depositAccounts.create
      summary: Create a standing deposit account
      description: |
        Returns permanent deposit details for one source currency and rail. Every deposit received
        creates an `onramp` transfer into the destination wallet, so deposits share the transfer
        state machine, receipts and events with one-off on-ramps.

        Only bank rails have standing details. PayPal collects one payment at a time through an
