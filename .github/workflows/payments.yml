# Builds and tests the payments API (src/Ndeipi.Payments) against a SQL Server container. The tests
# create and drop their own databases, so the container needs nothing set up beforehand.
name: Payments API

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/Ndeipi.Payments/**"
      - "tests/Ndeipi.Payments.Tests/**"
      - "docs/payments-api/**"
      - ".github/workflows/payments.yml"
  push:
    branches: [main]
    paths:
      - "src/Ndeipi.Payments/**"
      - "tests/Ndeipi.Payments.Tests/**"
      - "docs/payments-api/**"
      - ".github/workflows/payments.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # A throwaway password for a container that lives only as long as this job.
          MSSQL_SA_PASSWORD: "Ci-Payments-Tests-1"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci-Payments-Tests-1' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      PAYMENTS_TEST_SQL: "Server=localhost,1433;User ID=sa;Password=Ci-Payments-Tests-1;TrustServerCertificate=True"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build tests/Ndeipi.Payments.Tests -c Release
      - name: Test
        run: dotnet test tests/Ndeipi.Payments.Tests -c Release --no-build --logger "trx;LogFileName=payments.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payments-test-results
          path: tests/Ndeipi.Payments.Tests/TestResults
